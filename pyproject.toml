[project]
name = "archivore"
version = "0.2.0"
description = "Personal web-reading capture system and AI second brain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "aiohttp>=3.10",
    "rich>=13",
    "html2text>=2024.2.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
firefox = ["lz4>=4"]

[project.scripts]
archivore = "archivore.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archivore"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
